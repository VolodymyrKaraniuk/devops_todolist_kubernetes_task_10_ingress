apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mate-ingress
  annotations:
    nginc.ingress.kubernetes.io/rewrite-target: /$2
spec:
  rules:
    - http:
        paths:
          - pathType: Prefix
            path: /(/|$)(.*)
            backend:
              service:
                name: todoapp-service
                port:
                  number: 8000
